# Deployed flat into /opt/anontalk/docker-compose.yml by infra/scripts/provision.sh --
# every relative path below is relative to /opt/anontalk on the VM, not this repo path.
services:
  api:
    image: ghcr.io/${GHCR_OWNER}/anontalk-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./api.env
    expose:
      - "3000"
    networks:
      - anontalk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - anontalk

networks:
  anontalk:
    driver: bridge
