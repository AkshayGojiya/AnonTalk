# Temporary HTTP-only config used once, before the first TLS certificate exists.
# provision.sh swaps this out for anontalk.conf (rendered from anontalk.conf.template)
# right after the initial `certbot certonly` succeeds.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "anontalk api: bootstrapping tls\n";
        add_header Content-Type text/plain;
    }
}
